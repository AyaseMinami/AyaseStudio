[package]
name = "ayase-studio"
version = "0.1.0-beta.2"
description = "A lightweight local-first desktop chat client"
authors = ["Ayase Studio contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ayase_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
leveldb-core = "=0.1.2"
crc32c = "0.6"
snap = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "~2.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
